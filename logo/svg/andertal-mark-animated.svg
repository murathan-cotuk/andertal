<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 58 384 390" width="384" height="390"><style>
.l,.r{stroke-dasharray:320;stroke-dashoffset:320;animation:draw .7s cubic-bezier(.65,0,.35,1) forwards}
.r{animation-delay:.22s}
.f{opacity:0;animation:fade .35s .85s ease-out forwards}
.d{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:drop .7s 1s cubic-bezier(.34,1.56,.64,1) forwards}
.w{clip-path:inset(0 100% 0 0);animation:wipe .8s 1.15s cubic-bezier(.22,1,.36,1) forwards}
@keyframes draw{0%{stroke-dashoffset:320;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes fade{to{opacity:1}}
@keyframes drop{0%{opacity:0;transform:translateY(-180%) scale(.6)}60%{opacity:1;transform:translateY(0) scale(1.08,.9)}100%{opacity:1;transform:none}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.l,.r,.f,.d,.w{animation:none;stroke-dashoffset:0;opacity:1;clip-path:none;transform:none}}
</style><defs><mask id="yf" maskUnits="userSpaceOnUse"><path d="M124.5 387.6 L256 118" stroke="#fff" stroke-width="88" stroke-linecap="round"/></mask></defs><path class="l" d="M124.5 387.6 L256 118" fill="none" stroke="#FF9A3C" stroke-width="88" stroke-linecap="round"/><path class="r" d="M387.5 387.6 L256 118" fill="none" stroke="#FF6A00" stroke-width="88" stroke-linecap="round"/><g mask="url(#yf)"><path class="f" d="M387.5 387.6 L256 118" fill="none" stroke="#C94700" stroke-width="88" stroke-linecap="round"/></g><circle class="d" cx="256" cy="350" r="40" fill="#1A1A1A"/></svg>
