<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andertal Logo</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#F4F4F2;color:#1A1A1A;padding:24px}
.card{background:#fff;border-radius:20px;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:24px;max-width:900px;margin:0 auto 20px}
.card img{max-width:100%;height:110px}.dark{background:#1A1A1A}
button{font:600 14px system-ui;border:0;border-radius:999px;padding:10px 20px;background:#FF6A00;color:#fff;cursor:pointer}</style></head><body>
<div class="card"><img id="anim" src="svg/andertal-logo-animated.svg" alt="Andertal"><button onclick="var i=document.getElementById('anim');i.src='svg/andertal-logo-animated.svg?'+Date.now()">Tekrar oynat</button></div>
<div class="card"><img src="svg/andertal-logo.svg" alt=""></div>
<div class="card dark"><img src="svg/andertal-logo-white.svg" alt=""></div>
</body></html>
