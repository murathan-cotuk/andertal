name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Soften flaky registry drops (ECONNRESET) without changing install semantics.
env:
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/ci-npm-ci.sh

      - name: Run linter
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/ci-npm-ci.sh

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/ci-npm-ci.sh

      - name: Run unit tests
        run: npm run test

  settlement:
    name: Settlement tests (PostgreSQL)
    runs-on: ubuntu-latest
    # Money flows (payables, ledger, refunds, disputes, payouts) are tested against a real
    # PostgreSQL - idempotency and double-payout guards live in constraints and locks.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settlement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/ci-npm-ci.sh

      - name: Run settlement tests
        working-directory: apps/medusa-backend
        run: npm run test:settlement
        env:
          SETTLEMENT_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/settlement_test

  audit:
    name: Security Audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # npm audit only needs the lockfile — no install required.
      # AUDIT_STRICT=0: report only (Medusa transitive noise); does not fail the job.
      - name: Run npm audit (high+)
        run: node scripts/ci-npm-audit.js
        env:
          AUDIT_LEVEL: high
          AUDIT_STRICT: "0"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/ci-npm-ci.sh

      - name: Build shop app
        run: npm run build -- --filter=@andertal/shop

      - name: Build sellercentral app
        run: npm run build -- --filter=@andertal/sellercentral

  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [build]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/ci-npm-ci.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build shop for production start
        run: npm run build -- --filter=@andertal/shop

      - name: Run Playwright smoke tests
        run: npx playwright test --project=chromium
        env:
          CI: true
